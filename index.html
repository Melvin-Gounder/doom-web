<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Melvin's DOOM</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #ccc;
    font-family: Consolas, Monaco, monospace;
    overflow: hidden;
  }

  #container {
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  #game-area {
    position: relative;
    flex: 1;
    background: #000;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    image-rendering: pixelated;
    background: #000;
    outline: none;
  }

  #boot {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #050505;
    z-index: 10;
    padding: 20px;
  }

  #boot.hidden {
    display: none;
  }

  h1 {
    color: #c62828;
    font-size: 44px;
    letter-spacing: 8px;
    margin-bottom: 5px;
  }

  #subtitle {
    color: #777;
    margin-bottom: 25px;
  }

  #start {
    padding: 14px 30px;
    background: #b71c1c;
    color: white;
    border: none;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  #start:disabled {
    background: #333;
    color: #777;
  }

  #log {
    margin-top: 20px;
    width: 90%;
    max-width: 650px;
    height: 200px;
    overflow: auto;
    background: #090909;
    border: 1px solid #222;
    padding: 10px;
    font-size: 11px;
    color: #73c991;
    white-space: pre-wrap;
  }

  #controls {
    padding: 12px;
    text-align: center;
    background: #080808;
    color: #777;
    font-size: 12px;
  }
</style>
</head>

<body>

<div id="container">

  <div id="game-area">

    <canvas id="canvas" tabindex="0"></canvas>

    <div id="boot">

      <h1>DOOM</h1>

      <div id="subtitle">
        Freedoom · WebAssembly
      </div>

      <button id="start" disabled>
        LOADING...
      </button>

      <div id="log"></div>

    </div>

  </div>

  <div id="controls">
    Arrow Keys = Move |
    CTRL = Fire |
    Space = Use |
    Shift = Run |
    ESC = Menu
  </div>

</div>

<script>

const canvas = document.getElementById("canvas");
const boot = document.getElementById("boot");
const startButton = document.getElementById("start");
const logBox = document.getElementById("log");

function log(text) {
  const line = document.createElement("div");
  line.textContent = text;
  logBox.appendChild(line);
  logBox.scrollTop = logBox.scrollHeight;
}

window.onerror = function(message, source, line) {
  log("ERROR: " + message + " line " + line);
};

var Module = {

  canvas: canvas,

  noInitialRun: true,

  noExitRuntime: true,

  print: function(text) {
    log(text);
  },

  printErr: function(text) {
    log("ERR: " + text);
  },

  setStatus: function(text) {
    if (text) {
      log("[status] " + text);
    }
  },

  preRun: function() {

    log("[boot] loading game files");

    try {
      Module.FS.mkdir("/savefiles");
    } catch (e) {}

    Module.FS.createPreloadedFile(
      "",
      "freedoom1.wad",
      "freedoom1.wad",
      true,
      true
    );

    Module.FS.createPreloadedFile(
      "",
      "default.cfg",
      "default.cfg",
      true,
      true
    );

  },

  onRuntimeInitialized: function() {

    log("[runtime] engine initialized");

    startButton.disabled = false;

    startButton.textContent = "LAUNCH DOOM";

  }

};

startButton.addEventListener("click", function() {

  startButton.disabled = true;

  startButton.textContent = "STARTING...";

  canvas.focus();

  const args = [

    "-iwad",
    "freedoom1.wad",

    "-window",

    "-nogui",

    "-nomusic",

    "-config",
    "default.cfg",

    "-savedir",
    "/savefiles"

  ];

  try {

    callMain(args);

    boot.classList.add("hidden");

  } catch (error) {

    log("START ERROR: " + error);

    startButton.disabled = false;

    startButton.textContent = "RETRY";

  }

});

log("[boot] loading WebAssembly engine...");

const engine = document.createElement("script");

engine.src = "websockets-doom.js";

engine.onerror = function() {
  log("ERROR: websockets-doom.js failed to load");
};

document.body.appendChild(engine);

</script>

</body>
</html>
