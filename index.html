<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Melvin's DOOM Terminal</title>

  <style>
    body {
      margin: 0;
      background: #050505;
      color: #39ff14;
      font-family: Consolas, Monaco, monospace;
      text-align: center;
    }

    .terminal {
      max-width: 900px;
      margin: 50px auto;
      border: 1px solid #39ff14;
      padding: 30px;
      box-shadow: 0 0 25px rgba(57, 255, 20, 0.2);
    }

    h1 {
      color: #ffffff;
    }

    .boot {
      text-align: left;
      line-height: 1.8;
      margin: 30px 0;
    }

    .doom {
      color: #ff3333;
      font-size: 42px;
      font-weight: bold;
      margin-top: 40px;
    }

    button {
      margin-top: 25px;
      padding: 15px 30px;
      background: #111;
      color: #39ff14;
      border: 1px solid #39ff14;
      font-family: inherit;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #39ff14;
      color: #000;
    }
  </style>
</head>

<body>

  <div class="terminal">

    <h1>melvin@github:~$ ./doom</h1>

    <div class="boot">
      [boot] initializing DOOM environment...<br><br>

      [ OK ] Loading game engine<br>
      [ OK ] Initializing browser runtime<br>
      [ OK ] Loading assets<br>
      [ OK ] Checking controls<br>
      [ OK ] System ready
    </div>

    <div class="doom">
      DOOM
    </div>

    <p>Browser game loading soon.</p>

    <button onclick="alert('DOOM engine coming next!')">
      LAUNCH DOOM
    </button>

  </div>

</body>
</html>
